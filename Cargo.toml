[package]
name = "macbook-iso-patcher"
version = "0.1.0"
edition = "2024"
description = "Windows ISO patcher for Intel MacBooks"
build = "build.rs"

[dependencies]
anyhow = "1"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.38", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
walkdir = "2"
webbrowser = "1"
fs2 = "0.4"
png = "0.17"

[build-dependencies]
cc = "1"
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true
